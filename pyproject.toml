[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denji-standby"
version = "0.1.0"
description = "Denji TUI standby dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
denji = "denji_standby.launcher:run_denji"
standby = "denji_standby.launcher:run_denji"

[tool.setuptools]
py-modules = ["main"]
packages = ["denji_standby"]
