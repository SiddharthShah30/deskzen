[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "denji-standby"
version = "0.1.0"
description = "Denji TUI standby dashboard"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyttsx3>=2.90",
    "SpeechRecognition>=3.10.1",
    "sounddevice>=0.5.0",
    "opencv-python>=4.10.0.84",
    "numpy>=1.21.0",
    "requests>=2.28.0",
    "windows-curses>=2.3.0; sys_platform == 'win32'"
]

[project.scripts]
denji = "denji_standby.launcher:run_denji"
standby = "denji_standby.launcher:run_denji"

[tool.setuptools]
py-modules = ["main"]
packages = ["denji_standby"]
